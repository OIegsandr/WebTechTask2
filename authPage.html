<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styleClass.css">
    <link rel="stylesheet" href="reset.css">
</head>
<body>
    <header>
        <nav>
            <ul class="ulNav">
                <li class="navItem">
                    <img src="Images/numPadding.png" height="25" width="10">
                    <a href = "index.html" class="resetURLStyle">Веб - технологии</a> </a>
                </li>
                <li class="navItem">
                    <img src="Images/numPadding.png" height="25" width="10">
                    <a href = "index.html" class="resetURLStyle">Университет "Дубна"</a> </a>
                </li>
                <li class="navItem">
                    <img src="Images/numPadding.png" height="25" width="10">
                    <a href = "index.html" class="resetURLStyle">Что-то третье"</a> </a>
                </li>
            </ul>
        </nav>
    </header><br>

    <div class="centreFlex">
        <form class="wholeBorderStyle centreFlex">
            <div class="flexSetCentre">
                <div class="flexSetLeft"><br><br>
                    <li>Как вам удобно получить ответ:<br>
                    <div>
                        <input type="radio" id="emailMes" name="gettingMessages" value="email">
                        <label for="emailMes">По почте</label>
                    </div>
                    <div>
                        <input type="radio" id="phoneMes" name="gettingMessages" value="phone">
                        <label for="phoneMes">По телефону</label>
                    </div>
                    <div>
                        <input type="radio" id="notanyMes" name="gettingMessages" value="nothing">
                        <label for="notanyMes">Не нужно отвечать</label>
                    </div>
                </div><br>
                <div>
                    <li>Укажите тему вопроса<br>
                    <select class="pickThingStyle"  class="flexSetLeft">
                        <option>Работа</option>
                        <option>Учеба</option>
                        <option>Прочее</option>
                    </select>
                </div><br>
                <div  class="flexSetLeft">
                    <li>И еще один вопрос?<br>
                    <div>
                        <input type="checkbox" id="anotherQ1" name="answerQ" value="firstQ">
                        <label for="anotherQ1">может так</label>
                    </div>
                    <div>
                        <input type="checkbox" id="anotherQ2" name="answerQ" value="secondQ">
                        <label for="anotherQ2">или не так</label>
                    </div>
                    <div>
                        <input type="checkbox" id="anotherQ3" name="answerQ" value="thirdQ">
                        <label for="anotherQ3">иначе</label>
                    </div>                           
                </div><br>
                <div class="linedFlex">
                    <ul class="listStyleNone">
                        <li><label for="userName">Ваше имя:</label></li>
                        <li><label for="userEmail">Адрес почты:</label></li>
                        <li><label for="userPhone">Номер телефона:</label></li>
                    </ul>
                    <div class="inputFieldFlex">
                        <input type="text" name="userName" class="inputFieldStyle">
                        <input type="email" name="userEmail" class="inputFieldStyle">
                        <input type="text" name="userPhone" class="inputFieldStyle">
                    </div>
                    <!-- <div>
                        <label for="userQuestion">Ваш вопрос:</label><br>
                        <textarea name="userQuestion" cols="30" rows="3"></textarea>
                    </div> -->
                </div><br>
                <div class="flexSetCentre">
                    <li>
                        <input type="submit" value="Отправить вопрос" class="inputFieldStyle" style="height: 30px; width: 200px;">
                    </li>
                </div><br>
            </div>
        </form>
    </div><br>

    <footer><br><br>
        <div class="photosFlex">
            <div class="logosFlex">
                <img src = "Images/logo3.png" width="100" height="100">
            </div>
            <li class="listStyleNone textFlexd">Сайт разработан OL, Copyright @ 2026</li>
        </div>
    </footer>
</body>
</html>
