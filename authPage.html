<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация</title>
    <link rel="stylesheet" href="styleClass.css">
    <link rel="stylesheet" href="reset.css">
    <script src="script.js"></script>
</head>
<body>
    <header>
        <nav>
            <ul class="ulNav">
                <li class="navItem">
                    <img src="Images/numPadding.png" height="25" width="10">
                    <a href="index.html" class="resetURLStyle textColorWhite">Веб - технологии</a>
                </li>
                <li class="navItem">
                    <img src="Images/numPadding.png" height="25" width="10">
                    <a href="index.html" class="resetURLStyle textColorWhite">Университет "Дубна"</a>
                </li>
                <li class="navItem">
                    <img src="Images/numPadding.png" height="25" width="10">
                    <a href="news.html" class="resetURLStyle textColorWhite">Новости</a>
                </li>
                <li class="navItem">
                    <input type="button" value="Сменить тему" onclick="changeTheme()">
                </li>
            </ul>
        </nav>
    </header><br>

    <div class="centreFlex">
        <form class="wholeBorderStyle textColorWhite centreFlex" id="userForm" onsubmit="checkData(event)">
            <div class="flexSetCentre">
                <div class="linedFlex"><br><br>
                    <ul class="listStyleNone">
                        <li><label for="userLogin">Логин:</label></li>
                        <li><label for="userPassword">Пароль:</label></li>
                        <li><label for="userEmail">Адрес почты:</label></li>
                    </ul>
                    <div class="inputFieldFlex">
                        <input type="text" id="userLogin" name="userLogin" class="inputFieldStyle backgroundWhite">
                        <input type="password" id="userPassword" name="userPassword" class="inputFieldStyle backgroundWhite">
                        <input type="email" id="userEmail" name="userEmail" class="inputFieldStyle backgroundWhite">
                    </div>
                </div><br>
                <div class="flexSetLeft">
                    <div>
                        <input type="checkbox" id="subscribe" name="subscribe" checked>
                        <label for="subscribe">Подписаться на рассылку</label>
                    </div>
                </div><br>
                <div class="flexSetLeft">
                    <li>Ваш пол:</li>
                    <div>
                        <input type="radio" id="genderMale" name="gender" value="male">
                        <label for="genderMale">М</label>
                    </div>
                    <div>
                        <input type="radio" id="genderFemale" name="gender" value="female">
                        <label for="genderFemale">Ж</label>
                    </div>
                </div><br>
                <div>
                    <li><label for="userCity">Укажите город</label></li>
                    <select id="userCity" name="userCity" class="pickThingStyle backgroundWhite">
                        <option value="dubna">Дубна</option>
                        <option value="moscow">Москва</option>
                        <option value="saratov">Саратов</option>
                    </select>
                </div><br>
                <div class="flexSetLeft">
                    <li>Как вам удобно получить ответ:</li>
                    <div>
                        <input type="radio" id="emailMes" name="gettingMessages" value="email">
                        <label for="emailMes">По почте</label>
                    </div>
                    <div>
                        <input type="radio" id="phoneMes" name="gettingMessages" value="phone">
                        <label for="phoneMes">По телефону</label>
                    </div>
                    <div>
                        <input type="radio" id="notanyMes" name="gettingMessages" value="nothing">
                        <label for="notanyMes">Не нужно отвечать</label>
                    </div>
                </div><br>
                <div>
                    <li><label for="questionTheme">Укажите тему вопроса</label></li>
                    <select id="questionTheme" name="questionTheme" class="pickThingStyle backgroundWhite">
                        <option>Работа</option>
                        <option>Учеба</option>
                        <option>Прочее</option>
                    </select>
                </div><br>
                <div class="flexSetLeft">
                    <li>И еще один вопрос?</li>
                    <div>
                        <input type="checkbox" id="anotherQ1" name="answerQ" value="firstQ">
                        <label for="anotherQ1">может так</label>
                    </div>
                    <div>
                        <input type="checkbox" id="anotherQ2" name="answerQ" value="secondQ">
                        <label for="anotherQ2">или не так</label>
                    </div>
                    <div>
                        <input type="checkbox" id="anotherQ3" name="answerQ" value="thirdQ">
                        <label for="anotherQ3">иначе</label>
                    </div>
                </div><br>
                <div class="linedFlex">
                    <ul class="listStyleNone">
                        <li><label for="userName">Ваше имя:</label></li>
                        <li><label for="userPhone">Номер телефона:</label></li>
                    </ul>
                    <div class="inputFieldFlex">
                        <input type="text" id="userName" name="userName" class="inputFieldStyle backgroundWhite">
                        <input type="text" id="userPhone" name="userPhone" class="inputFieldStyle backgroundWhite">
                    </div>
                </div><br>
                <div>
                    <div id="askQuestion" class="flexSetCentre">
                        <li>
                            <input type="button" id="askQuestionButton" value="Задать вопрос" class="inputFieldStyle backgroundWhite" style="height: 30px; width: 200px;" onclick="document.getElementById('questionField').style.display = 'block'; document.getElementById('sendQuestion').style.display = 'flex'; document.getElementById('askQuestion').style.display = 'none';">
                        </li>
                    </div>
                    <div id="questionField" style="display: none;">
                        <li><label for="userQuestion">Ваш вопрос:</label></li>
                        <textarea id="userQuestion" name="userQuestion" cols="30" rows="3" class="textAreaStyle textColorBlack backgroundWhite"></textarea>
                    </div>
                </div><br>
                <div id="sendQuestion" class="flexSetCentre" style="display: none;">
                    <li>
                        <input type="submit" value="Отправить вопрос" class="inputFieldStyle backgroundWhite" style="height: 30px; width: 200px;">
                    </li>
                </div><br>
                <div class="flexSetCentre">
                    <input type="number" id="createNumber" min="0" placeholder="Число" class="inputFieldStyle backgroundWhite">
                    <input type="button" id="createValue" value="Создать" class="inputFieldStyle backgroundWhite" style="height: 30px; width: 200px;" onclick="createTextArea()">
                </div>
                <div id="container" class="flexSetCentre"></div>
            </div>
        </form>
    </div><br>

    <div class="centreFlex">
        <div id="resultBlock" class="wholeBorderStyle textColorWhite resultStyle">
            <li id="resultTitle"></li><br>
            <li id="resultLogin"></li>
            <li id="resultPassword"></li>
            <li id="resultEmail"></li>
            <li id="resultCity"></li>
            <li id="resultSubscribe"></li>
        </div>
    </div><br>

    <footer class="backgroundWhite"><br><br>
        <div class="photosFlex">
            <div class="logosFlex">
                <img src="Images/logo3.png" width="100" height="100">
            </div>
            <li class="listStyleNone textFlex">Сайт разработан OL, Copyright @ 2026</li>
        </div>
    </footer>
</body>
</html>
